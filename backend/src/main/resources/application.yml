server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: erp-backend
  # prod 组合档：docker 部署用 SPRING_PROFILES_ACTIVE=prod，等价 mysql+prod
  profiles:
    active: mysql
    group:
      prod: mysql,prod

  # JSON：时区统一、忽略 null、日期按 ISO 字符串输出
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB

  output:
    ansi:
      enabled: always

---
# ===================== MySQL 生产/常规开发配置（默认） =====================
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 必须带 serverTimezone=Asia/Shanghai，否则日期字段会错位（原文档附录缺陷第 7 条）
    # 账号密码支持环境变量覆盖，避免生产密码硬编码进代码库
    url: ${DB_URL:jdbc:mysql://localhost:3306/erp_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      pool-name: ErpHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

---
# ===================== H2 免安装本地试运行配置 =====================
# 启动方式：mvn spring-boot:run -Dspring-boot.run.profiles=h2
# 用途：本机未安装 MySQL 时快速体验与自测，数据存于内存，重启即丢失
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:erp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      continue-on-error: false

---
# ===================== 公共配置 =====================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto
      table-prefix: ""
  mapper-locations: classpath*:/mapper/**/*.xml

erp:
  order-no:
    prefix: ORD
    seq-length: 4
    max-retry: 3
  auth:
    # 生产必须通过环境变量 JWT_SECRET 覆盖（HS256 要求 >= 32 字节）
    jwt-secret: ${JWT_SECRET:erp-local-dev-secret-key-change-me-please-32B}
    # 登录态有效期（小时）
    token-ttl-hours: 12
    # 注册邀请码：留空则开放注册；公网部署建议设置
    invite-code: ${REGISTER_CODE:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.erp: DEBUG
    com.erp.order.OrderNoGenerator: INFO

---
# ===================== 生产加固配置（prod 组合档追加生效） =====================
# 关闭接口文档与敏感端点详情，仅保留健康探针；日志收敛为 INFO。
# 置于文件末尾，确保覆盖上方公共配置。
spring:
  config:
    activate:
      on-profile: prod

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.erp: INFO
